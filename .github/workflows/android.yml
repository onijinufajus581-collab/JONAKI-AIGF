name: JONAKI AI - Automatic APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jonaki-ai-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract and Build JONAKI AI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract JONAKI AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for JONAKI AI ZIP..."

          ZIP_FILE=""

          while IFS= read -r file; do
            if unzip -Z1 "$file" | grep -q '^app/build.gradle$'; then
              ZIP_FILE="$file"
              break
            fi
          done < <(find . -maxdepth 4 -type f -iname '*jonaki*.zip' -print)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: JONAKI AI ZIP not found."
            echo "Upload the complete JONAKI AI ZIP to the repository."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/jonaki_project"

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/jonaki_project"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/jonaki_project" -maxdepth 7 -type f -print

      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/jonaki_project"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/jonaki/ai/MainActivity.java"
            "app/src/main/java/com/jonaki/ai/VoiceAssistantService.java"
            "app/src/main/res/drawable/ic_jonaki.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$PROJECT/$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

          echo "JONAKI AI project validation successful."

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/jonaki_project"

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/jonaki_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload JONAKI AI APK
        uses: actions/upload-artifact@v4
        with:
          name: JONAKI-AI-APK
          path: jonaki_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Show Build Failure
        if: failure()
        run: |
          echo "JONAKI AI build failed."
          echo "Check the failed step above for the exact error."
